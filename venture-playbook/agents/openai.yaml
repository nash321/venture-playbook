interface:
  display_name: "项目研判与行动指南"
  short_description: "原文精读、公开同类研究与可编辑HTML行动工作台"
  default_prompt: "使用 $venture-playbook 分析我提供的创业项目，充分使用当前最高可用推理能力，不敷衍，广泛尽力收集并实读相关信息；所有关键信息和结论必须对应来源证据，禁止编造，未知明确标注，交付前逐条回查；用小白能看懂的大白话写完整报告，不减少事实、条件、风险和来源；必要时用准确例子或比喻，有先后、因果或判断关系就用离线内嵌SVG讲清楚；直接复用包内固定体验卡界面，报告最后另放同一张原始扫码海报；生成可编辑行动指南，完成后自动在浏览器打开并确认加载，保留报告页供我使用。"
