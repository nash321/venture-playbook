name: Windows portable acceptance
on:
  push:
    branches: ['codex/presale-9.1.15']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows bootstrap and repeat
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $VP_SKILL=Join-Path $env:GITHUB_WORKSPACE 'venture-playbook'
          $VP_HARNESS='codex'
          $VP_REPORT=Join-Path $env:GITHUB_WORKSPACE 'temp/bootstrap-first.json'
          New-Item -ItemType Directory -Force (Split-Path $VP_REPORT) | Out-Null
          $guide=Get-Content -LiteralPath (Join-Path $VP_SKILL 'references/RUNTIME-BOOTSTRAP.md') -Raw -Encoding UTF8
          $entry=[regex]::Match($guide,'(?s)```powershell\s*(.*?)```').Groups[1].Value
          if (!$entry) { throw 'missing_native_entry' }
          & ([scriptblock]::Create($entry))
          $first=Get-Content -LiteralPath $VP_REPORT -Raw -Encoding UTF8 | ConvertFrom-Json
          if (!$first.ready -or !$first.setup.configured -or $first.platform.system -ne 'windows') { throw 'first_bootstrap_failed' }
          $P=$first.python
          & $P -I -X utf8 (Join-Path $VP_SKILL 'scripts/bootstrap.py') --harness codex --managed --report temp/bootstrap-repeat.json
          if ($LASTEXITCODE -ne 0) { throw 'repeat_bootstrap_failed' }
          $repeat=Get-Content temp/bootstrap-repeat.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($repeat.user_path_added -or $repeat.setup.changed) { throw 'repeat_not_idempotent' }
          $userPath=[Environment]::GetEnvironmentVariable('Path','User')
          if (!(($userPath -split ';') -contains $first.path_entry)) { throw 'user_path_not_persisted' }
          & $P -I -X utf8 (Join-Path $VP_SKILL 'scripts/venture.py') doctor
          & $P -I -X utf8 (Join-Path $VP_SKILL 'scripts/venture.py') build (Join-Path $VP_SKILL 'examples/project-demo.json') --out 'temp/中文 空格/report.html'
          & $P -I -X utf8 (Join-Path $VP_SKILL 'scripts/venture.py') check 'temp/中文 空格/report.html'
          if ($LASTEXITCODE -ne 0) { throw 'report_check_failed' }
          $env:VP_ACCEPTANCE_PYTHON=$P
          & $P -m venv temp/browser-env
          $B=Join-Path $env:GITHUB_WORKSPACE 'temp/browser-env/Scripts/python.exe'
          & $B -m pip install --disable-pip-version-check playwright==1.40.0
          if ($LASTEXITCODE -ne 0) { throw 'browser_test_dependency_failed' }
          $chrome=Join-Path ${env:ProgramFiles} 'Google/Chrome/Application/chrome.exe'
          if (!(Test-Path $chrome)) { throw 'runner_chrome_not_available' }
          & $B -X utf8 (Join-Path $VP_SKILL 'tests/browser_smoke.py') --report 'temp/中文 空格/report.html' --browser $chrome --out temp/windows-browser
          if ($LASTEXITCODE -ne 0) { throw 'windows_browser_failed' }
      - name: Browser close and reopen with real file storage
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright, expect
          root=Path.cwd(); report=root/'temp/中文 空格/report.html'
          profile=root/'temp/windows-reopen-profile'
          chrome=Path(os.environ['ProgramFiles'])/'Google/Chrome/Application/chrome.exe'
          checks=[]
          with sync_playwright() as p:
              def opened():
                  ctx=p.chromium.launch_persistent_context(str(profile),headless=True,chromium_sandbox=True,executable_path=str(chrome))
                  page=ctx.pages[0];page.goto(report.as_uri());page.wait_for_selector('html.enhanced')
                  return ctx,page
              ctx,page=opened();row=page.locator('#task-list .task-row').first
              row.locator('button[aria-label^="编辑"]').click()
              page.locator('#task-form [name="title"]').fill('Windows修改后重开检查')
              page.locator('#task-form [name="title"]').press('Tab')
              page.locator('#editor-close').click()
              expect(page.locator('#task-list .task-row').first.locator('h4')).to_have_text('Windows修改后重开检查')
              ctx.close()
              ctx,page=opened();expect(page.locator('#task-list .task-row').first.locator('h4')).to_have_text('Windows修改后重开检查')
              checks.append('edit_restored_after_browser_process_restart')
              page.locator('#task-list .task-row').first.locator('button[aria-label^="编辑"]').click()
              page.locator('#task-form [name="title"]').fill('Windows撤销保存检查')
              page.locator('#task-form [name="title"]').press('Tab')
              page.locator('#editor-close').click();page.locator('#undo').click()
              expect(page.locator('#task-list .task-row').first.locator('h4')).to_have_text('Windows修改后重开检查')
              ctx.close()
              ctx,page=opened();expect(page.locator('#task-list .task-row').first.locator('h4')).to_have_text('Windows修改后重开检查')
              checks.append('undo_restored_after_browser_process_restart');ctx.close()
          (root/'temp/windows-reopen.json').write_text(json.dumps({'checks':checks,'operating_system':'windows','loading_mode':'file URL','real_process_restarts':2,'headless':True,'customer_foreground_or_oauth_verified':False},ensure_ascii=False,indent=2),encoding='utf-8')
          '@
          $script | Set-Content -LiteralPath temp/windows-reopen.py -Encoding UTF8
          & temp/browser-env/Scripts/python.exe -X utf8 temp/windows-reopen.py
          if ($LASTEXITCODE -ne 0) { throw 'windows_reopen_failed' }
      - name: Keep exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-evidence
          path: |
            temp/bootstrap-*.json
            temp/windows-browser/
            temp/windows-reopen.json
